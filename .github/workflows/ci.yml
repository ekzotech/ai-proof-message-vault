name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, intl, mbstring, pdo_sqlite, xml, zip
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: |
          php scripts/check-platform.php
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check PHP formatting
        run: composer lint

      - name: Run PHPUnit
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          composer test

      - name: Install matching ChromeDriver
        run: |
          google-chrome --version
          php artisan dusk:chrome-driver --detect

      - name: Run Dusk against isolated fixtures
        id: dusk
        run: composer dusk

      - name: Count browser diagnostics without publishing their contents
        if: failure() && steps.dusk.outcome == 'failure'
        run: |
          find tests/Browser/screenshots tests/Browser/source tests/Browser/console -type f ! -name .gitignore | wc -l
